# Nginx Reverse Proxy Configuration for چی‌کجا (ChikojA) — Ubuntu 24.04 LTS
# Copy to: /etc/nginx/sites-available/chikoja.conf
# Enable:  sudo ln -s /etc/nginx/sites-available/chikoja.conf /etc/nginx/sites-enabled/
# Test:    sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d chikoja.ir -d www.chikoja.ir

# Redirect www -> apex canonical domain (301 permanent, avoids duplicate SEO indexing)
server {
    listen 80;
    listen [::]:80;
    server_name chikoja.ir www.chikoja.ir;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://chikoja.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.chikoja.ir;

    # Managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/chikoja.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chikoja.ir/privkey.pem;

    return 301 https://chikoja.ir$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chikoja.ir;

    # SSL certificates (issued via Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/chikoja.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chikoja.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upload cap slightly above app's 6MB image limit (prevents oversized payload floods)
    client_max_body_size 8M;

    # Gzip compression for fast mobile loading & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Security headers (additional defense-in-depth at proxy layer)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NEVER expose storage, hidden files, or env files directly
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Serve immutable Vite hashed assets directly from disk with long-term caching
    location /assets/ {
        alias /opt/chikoja/client/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy all dynamic HTML (SEO-aware), API, robots.txt, sitemap.xml, and signed images to Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
